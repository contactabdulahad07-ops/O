<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Falak ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Animated Background -->
<div class="bg-animation"></div>

<!-- Floating Hearts -->
<div class="floating-hearts"></div>

<!-- ================= PASSWORD SCREEN ================= -->

<section id="passwordScreen" class="screen active">

<div class="glass">

<div class="lock">
🔒
</div>

<h1>Private Birthday Surprise</h1>

<p>
Enter Password To Continue
</p>

<input
type="password"
id="password"
placeholder="Enter Password">

<button id="unlockBtn">
Unlock ❤️
</button>

<p id="error"></p>

</div>

</section>

<!-- ================= WELCOME SCREEN ================= -->

<section id="welcomeScreen" class="screen">

<div class="glass">

<h1>
Happy Birthday
<br>
<span>Falak My Love ❤️</span>
</h1>

<div class="teddy-area">

<div class="teddy">

<img src="gray.png">

<p>Me 🩶</p>

</div>

<div class="cake">

<img src="cake.png">

</div>

<div class="teddy">

<img src="white.png">

<p>Falak 🤍</p>

</div>

</div>

<button id="surpriseBtn">

🎁 Surprise

</button>

</div>

</section>
<!-- ================= GAME SCREEN ================= -->

<section id="gameScreen" class="screen">

<div class="glass">

<h1>❤️ Collect Hearts ❤️</h1>

<p>Collect 10 Hearts To Continue</p>

<div id="gameArea"></div>

<h2 id="score">0 / 10</h2>

</div>

  </section>
  <!-- ================= CAKE SCREEN ================= -->

<section id="cakeScreen" class="screen">

<div class="glass">

<h1>🎂 Cut The Birthday Cake 🎂</h1>

<p>Click the knife to cut the cake ❤️</p>

<div class="cake-box">

<div class="candles">
🕯️ 🕯️ 🕯️
</div>

<img id="birthdayCake" src="cake.png" alt="Cake">

</div>

<button id="cutCakeBtn">
🔪 Cut Cake
</button>

</div>

</section>
<script src="script.js"></script>

</body>

  </html>
